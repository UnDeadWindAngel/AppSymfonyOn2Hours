services:
  nginx:
    image: nginx:alpine
    container_name: catalog_nginx
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - catalog_network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog_php
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL}
      MYSQL_TEST_URL: ${MYSQL_TEST_URL}
    depends_on:
      - postgres
      - mysql
    networks:
      - catalog_network

  postgres:
    image: postgres:15-alpine
    container_name: catalog_postgres
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_password
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - catalog_network

  mysql:
    image: mysql:8.0
    container_name: catalog_mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: catalog_test_db
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - catalog_network

networks:
  catalog_network:
    driver: bridge

volumes:
  database_data: